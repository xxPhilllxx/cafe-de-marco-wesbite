<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Café de Marco - Image Asset Gallery</title>
  <style>
    body {
      background-color: #0c0c0e;
      color: #f4f4f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 2rem;
    }
    h1 {
      font-family: Georgia, serif;
      color: #c5a880;
      border-bottom: 1px solid rgba(197, 168, 128, 0.2);
      padding-bottom: 1rem;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }
    .card {
      background-color: #121216;
      border: 1px solid rgba(197, 168, 128, 0.15);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card img {
      width: 100%;
      height: 250px;
      object-fit: contain;
      background-color: #000;
      border-radius: 4px;
    }
    .filename {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #a1a1aa;
      word-break: break-all;
      text-align: center;
    }
    .dimensions {
      font-size: 0.75rem;
      color: #71717a;
      margin-top: 0.2rem;
    }
  </style>
</head>
<body>
  <h1>Café de Marco - Uploaded Image Asset Gallery</h1>
  <p>Use this gallery to identify the filenames of the images you want to place in the Hero slider, About section, or Menu container.</p>
  
  <div class="gallery" id="gallery-container">
    <!-- Image cards will be generated here -->
  </div>

  <script>
    // List of files in public/images
    const images = [
      "about.png",
      "gallery_1.png",
      "gallery_11.jpeg",
      "gallery_cannoli.jpg",
      "gallery_lobster.jpg",
      "gallery_mussels.jpg",
      "gallery_patio.jpg",
      "gallery_prawns.jpg",
      "gallery_stained_glass.jpg",
      "gallery_steak.jpg",
      "gallery_steak_mushrooms.jpg",
      "gallery_tuna_tartare.jpg",
      "hero_2.png",
      "hero_3.png",
      "menu_page_1.jpg",
      "menu_page_2.jpg",
      "menu_page_3.jpg",
      "menu_sheet.jpeg",
      "menu_sheet_original.jpeg",
      "specialty_cheesecake.png",
      "specialty_crab_legs.png",
      "specialty_oysters.png"
];

    const container = document.getElementById("gallery-container");
    images.forEach(filename => {
      const card = document.createElement("div");
      card.className = "card";
      
      const img = document.createElement("img");
      img.src = `/images/${filename}`;
      img.alt = filename;
      
      const fileLabel = document.createElement("div");
      fileLabel.className = "filename";
      fileLabel.textContent = filename;
      
      card.appendChild(img);
      card.appendChild(fileLabel);
      container.appendChild(card);
    });
  </script>
</body>
</html>
