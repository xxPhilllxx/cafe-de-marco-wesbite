<!DOCTYPE html>
<html lang="en">
<head>

  <title>Café de Marco - Image Asset Gallery</title>
  <style>
    body {
      background-color: #0c0c0e;
      color: #f4f4f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 2rem;
    }
    h1 {
      font-family: Georgia, serif;
      color: #c5a880;
      border-bottom: 1px solid rgba(197, 168, 128, 0.2);
      padding-bottom: 1rem;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }
    .card {
      background-color: #121216;
      border: 1px solid rgba(197, 168, 128, 0.15);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card img {
      width: 100%;
      height: 250px;
      object-fit: contain;
      background-color: #000;
      border-radius: 4px;
    }
    .filename {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #a1a1aa;
      word-break: break-all;
      text-align: center;
    }
    .dimensions {
      font-size: 0.75rem;
      color: #71717a;
      margin-top: 0.2rem;
    }
  </style>
</head>
