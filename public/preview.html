<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Café de Marco - Image Asset Gallery</title>
  <style>
    body {
      background-color: #0c0c0e;
      color: #f4f4f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 2rem;
    }
    h1 {
      font-family: Georgia, serif;
      color: #c5a880;
      border-bottom: 1px solid rgba(197, 168, 128, 0.2);
      padding-bottom: 1rem;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }
    .card {
      background-color: #121216;
      border: 1px solid rgba(197, 168, 128, 0.15);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card img {
      width: 100%;
      height: 250px;
      object-fit: contain;
      background-color: #000;
      border-radius: 4px;
    }
    .filename {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #a1a1aa;
      word-break: break-all;
      text-align: center;
    }
    .dimensions {
      font-size: 0.75rem;
      color: #71717a;
      margin-top: 0.2rem;
    }
  </style>
</head>
<body>
  <h1>Café de Marco - Uploaded Image Asset Gallery</h1>
  <p>Use this gallery to identify the filenames of the images you want to place in the Hero slider, About section, or Menu container.</p>
  
  <div class="gallery" id="gallery-container">
    <!-- Image cards will be generated here -->
  </div>

  <script>
    // List of files in public/images
    const images = [
      "Gemini_Generated_Image_5sm2kk5sm2kk5sm2~2.png",
      "Gemini_Generated_Image_7zrzfg7zrzfg7zrz~2.png",
      "Gemini_Generated_Image_elzxvtelzxvtelzx~2.png",
      "Gemini_Generated_Image_f5hamdf5hamdf5ha~2.png",
      "Gemini_Generated_Image_g5ejleg5ejleg5ej~2.png",
      "Gemini_Generated_Image_hjmio6hjmio6hjmi~2.png",
      "Gemini_Generated_Image_jeaxwwjeaxwwjeax~2.png",
      "Gemini_Generated_Image_jzj7n6jzj7n6jzj7~2.png",
      "Gemini_Generated_Image_nla7ztnla7ztnla7~2.png",
      "Gemini_Generated_Image_qt557vqt557vqt55~2.png",
      "Gemini_Generated_Image_sctzmssctzmssctz~2.png",
      "Gemini_Generated_Image_t1r0t0t1r0t0t1r0~2.png",
      "Gemini_Generated_Image_u6urtvu6urtvu6ur~2.png",
      "Messenger_creation_1CC66A34-0E8A-4906-BDE8-126A5C6B8803~2.jpeg",
      "Messenger_creation_3460C4D6-081D-4B2A-A78A-8948C7513160~2.jpeg",
      "Messenger_creation_45B904A8-CEF9-4AA0-BC64-69F3279AF340~2.jpeg",
      "Messenger_creation_5801D3FD-BF9E-482C-8949-CB58E9682DFB~2.jpeg",
      "Messenger_creation_62EB044D-ECCB-4A9C-800A-3FC8CA5B3DED~2.jpeg",
      "Messenger_creation_DD8FD49C-7B7B-4150-BB43-19790310C933~2.jpeg"
];

    const container = document.getElementById("gallery-container");
    images.forEach(filename => {
      const card = document.createElement("div");
      card.className = "card";
      
      const img = document.createElement("img");
      img.src = `/images/${filename}`;
      img.alt = filename;
      
      const fileLabel = document.createElement("div");
      fileLabel.className = "filename";
      fileLabel.textContent = filename;
      
      card.appendChild(img);
      card.appendChild(fileLabel);
      container.appendChild(card);
    });
  </script>
</body>
</html>
